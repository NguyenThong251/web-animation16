name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # public/ is the origin's Vite build captured byte-for-byte, compiled for
      # "/". Pages serves this repo at /web-animation16/, so rebase a COPY:
      # root-absolute HTML/CSS URLs, `/assets/` + `/vendor/` JS literals, and the
      # base-path vars/args (Sb/Sg/Lw, Dv/LO). Each patch asserts its match count.
      # Files sit at the artifact root (Pages already mounts it at the subpath).
      - name: Prepare site
        run: |
          rm -rf _site && cp -r public _site
          node scripts/subpath.mjs _site web-animation16
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
